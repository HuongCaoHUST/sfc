---
# 1. Media Server (mediamtx)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-server
  template:
    metadata:
      labels:
        app: media-server
    spec:
      containers:
        - name: mediamtx
          image: bluenviron/mediamtx:latest
          ports:
            - containerPort: 8889
            - containerPort: 8888
            - containerPort: 8554
---
apiVersion: v1
kind: Service
metadata:
  name: media-server
spec:
  type: NodePort
  selector:
    app: media-server
  ports:
    - name: webrtc
      port: 8889
      targetPort: 8889
      nodePort: 30889 # Mở cổng WebRTC ra ngoài
    - name: hls
      port: 8888
      targetPort: 8888
      nodePort: 30888 # Mở cổng HLS ra ngoài
    - name: rtsp
      port: 8554
      targetPort: 8554
      nodePort: 30554 # Mở cổng RTSP ra ngoài

---
# 2. AI Dashboard
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-dashboard
  template:
    metadata:
      labels:
        app: ai-dashboard
    spec:
      containers:
        - name: ai-dashboard
          image: dashboard-ai-dashboard:latest 
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: "production"
          ports:
            - containerPort: 3000
            - containerPort: 5002
              protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: ai-dashboard
spec:
  type: NodePort
  selector:
    app: ai-dashboard
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30000 
    - name: udp-data
      port: 5002
      targetPort: 5002
      protocol: UDP

---
# 3. AI Detection 2
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-detection-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-detection-2
  template:
    metadata:
      labels:
        app: ai-detection-2
    spec:
      containers:
        - name: ai-detection
          image: gst-myfilter-opencv:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: GST_DEBUG
              value: "4"
            - name: GST_DEBUG_DUMP_DOT_DIR
              value: "/tmp/gst"
          command: ["/bin/sh", "-c"]
          args:
            - >
              gst-launch-1.0
              udpsrc port=5000 buffer-size=2097152 caps="application/x-rtp,media=video,clock-rate=90000,encoding-name=H264,payload=96" ! 
              rtph264depay ! avdec_h264 ! videoconvert ! videorate ! video/x-raw,format=BGR,framerate=25/1 !
              videoscale ! video/x-raw,width=640,height=640 !
              queue max-size-buffers=1 leaky=downstream !
              yolodetection model-path="/app/yolo11n.onnx" conf-threshold=0.2 dest-host="ai-dashboard" dest-port=5103 ! 
              fakesink sync=false
          volumeMounts:
            - name: model-volume
              mountPath: /app/yolo11n.onnx
      volumes:
        - name: model-volume
          hostPath:
            path: /home/huongcao/sfc/yolo11n.onnx
            type: File
---
apiVersion: v1
kind: Service
metadata:
  name: ai-detection-2
spec:
  selector:
    app: ai-detection-2
  ports:
    - name: udp-stream
      port: 5000
      targetPort: 5000
      protocol: UDP

---
# 4. Sender 3
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sender-3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sender-3
  template:
    metadata:
      labels:
        app: sender-3
    spec:
      containers:
        - name: sender
          image: restreamio/gstreamer:latest-dev
          workingDir: /app
          command: ["/bin/sh", "-c"]
          args:
            - >
              gst-launch-1.0 filesrc location=test_video.mp4 ! 
              qtdemux ! h264parse ! avdec_h264 ! videoconvert ! 
              videorate ! video/x-raw,framerate=25/1 ! tee name=t !
              queue ! x264enc tune=zerolatency speed-preset=ultrafast key-int-max=25 bitrate=2000 ! 
              h264parse ! rtspclientsink location=rtsp://media-server:8554/cam3 
              t. ! queue ! videoconvert ! x264enc tune=zerolatency speed-preset=ultrafast ! 
              rtph264pay config-interval=1 ! udpsink host=ai-detection-2 port=5000 sync=false
          volumeMounts:
            - name: app-volume
              mountPath: /app
      volumes:
        - name: app-volume
          hostPath:
            path: /home/huongcao/sfc
            type: Directory
