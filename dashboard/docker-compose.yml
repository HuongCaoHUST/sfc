version: '3.8'

services:
  sender:
    image: restreamio/gstreamer:latest-dev
    container_name: video_sender
    devices:
      - "/dev/video0:/dev/video0"
    command: >
      gst-launch-1.0 v4l2src device=/dev/video0 ! videoconvert ! tee name=t ! 
      queue ! x264enc tune=zerolatency speed-preset=ultrafast key-int-max=30 bitrate=2000 ! h264parse ! rtspclientsink location=rtsp://media_server:8554/cam1 
      t. ! queue ! videoconvert ! x264enc tune=zerolatency speed-preset=ultrafast ! rtph264pay config-interval=1 ! udpsink host=ai_detection port=5000 sync=false
    networks:
      - video_net
    depends_on:
      - mediamtx

  ai_detection:
    image: gst-myfilter-opencv:latest
    container_name: ai_detection
    depends_on:
      - sender
    volumes:
      - ./yolo11n.onnx:/app/yolo11n.onnx 
    command: >
      gst-launch-1.0
      udpsrc port=5000 buffer-size=2097152 caps="application/x-rtp,media=video,clock-rate=90000,encoding-name=H264,payload=96" ! 
      rtph264depay ! avdec_h264 ! videoconvert ! video/x-raw,format=BGR !
      yolodetection model-path="/app/yolo11n.onnx" dest-host="ai-dashboard" dest-port=5002 ! 
      fakesink sync=false
    networks:
      - video_net

  mediamtx:
    image: bluenviron/mediamtx
    container_name: media_server
    ports:
      - "8889:8889" # WebRTC
      - "8888:8888" # HLS
      - "8554:8554" # RTSaP
    networks:
      - video_net

  ai-dashboard:
    build: .
    container_name: ai_surveillance_dashboard
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    networks:
      - video_net

networks:
  video_net:
    driver: bridge