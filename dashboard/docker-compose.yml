version: '3.8'

services:
  sender:
    image: restreamio/gstreamer:latest-dev
    container_name: video_sender
    devices:
      - "/dev/video0:/dev/video0"
    command: >
      gst-launch-1.0 v4l2src device=/dev/video0 ! 
      videoconvert ! 
      x264enc tune=zerolatency speed-preset=ultrafast key-int-max=30 bitrate=2000 ! 
      h264parse ! 
      rtspclientsink location=rtsp://media_server:8554/cam1
    networks:
      - video_net
    depends_on:
      - mediamtx
  mediamtx:
    image: bluenviron/mediamtx
    container_name: media_server
    ports:
      - "8889:8889" # WebRTC
      - "8888:8888" # HLS
      - "8554:8554" # RTSaP
    networks:
      - video_net

  ai-dashboard:
    build: .
    container_name: ai_surveillance_dashboard
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    networks:
      - video_net

networks:
  video_net:
    driver: bridge