# MediaMTX Configuration for handling RTSP streams and WHEP

# Global settings
rtsp: yes
rtspAddress: :8554

# WebRTC configuration
webrtc: yes
webrtcAddress: :8889

# --- CẤU HÌNH XUYÊN NAT/INTERNET CHO WEBRTC ---
# Thay IP_CUA_BAN bằng IP Public của mạng nhà bạn (hoặc IP LAN của máy Ubuntu nếu chỉ xem nội bộ)
webrtcAdditionalHosts: [94.101.98.58]

# Bổ sung STUN Server của Google để hỗ trợ WebRTC tìm đường kết nối
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
# ----------------------------------------------

# HLS
hls: yes
hlsAddress: :8888

# Default path configuration
pathDefaults:
  source: publisher

# Explicit paths for each camera
paths:
  cam1:
    source: publisher
  cam2:
    source: publisher
  cam3:
    source: publisher
  cam4:
    source: publisher
  mystream:
    source: publisher