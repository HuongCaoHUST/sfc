version: '3.8'

services:
  sender:
    build: .
    container_name: video_sender
    devices:
      - "/dev/video0:/dev/video0"
    command: >
      v4l2src device=/dev/video0 ! 
      videoconvert ! 
      x264enc tune=zerolatency bitrate=2000 ! 
      rtph264pay config-interval=1 ! 
      udpsink host=flipper port=5000 sync=false
    networks:
      - video_net

  flipper:
    build: .
    container_name: video_flipper
    depends_on:
      - sender
    command: >
      udpsrc port=5000 caps="application/x-rtp,media=video,clock-rate=90000,encoding-name=H264,payload=96" ! 
      rtph264depay ! 
      avdec_h264 ! 
      videoconvert ! 
      videoflip method=horizontal-flip ! 
      x264enc tune=zerolatency bitrate=2000 ! 
      rtph264pay config-interval=1 ! 
      udpsink host=receiver port=5000 sync=false
    networks:
      - video_net

  receiver:
    build: .
    container_name: video_receiver
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix 
    depends_on:
      - flipper
    command: >
      compositor name=comp background=black
      sink_0::xpos=0 sink_0::ypos=0 sink_0::width=640 sink_0::height=480 
      sink_1::xpos=640 sink_1::ypos=0 sink_1::width=640 sink_1::height=480 
      sink_2::xpos=0 sink_2::ypos=480 sink_2::width=640 sink_2::height=480 
      sink_3::xpos=640 sink_3::ypos=480 sink_3::width=640 sink_3::height=480 ! 
      videoconvert ! 
      autovideosink 
      udpsrc port=5000 caps="application/x-rtp,media=video,clock-rate=90000,encoding-name=H264,payload=96" ! 
      rtph264depay ! 
      avdec_h264 ! 
      videoconvert ! 
      videoscale ! 
      video/x-raw,width=640,height=480 ! 
      comp.sink_0 
      videotestsrc pattern=black ! video/x-raw,width=640,height=480 ! comp.sink_1 
      videotestsrc pattern=black ! video/x-raw,width=640,height=480 ! comp.sink_2 
      videotestsrc pattern=black ! video/x-raw,width=640,height=480 ! comp.sink_3
    networks:
      - video_net

networks:
  video_net:
    driver: bridge