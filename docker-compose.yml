version: '3.8'

services:
  sender:
    build: .
    container_name: video_sender
    devices:
      - "/dev/video0:/dev/video0"
    command: >
      v4l2src device=/dev/video0 ! 
      videoconvert ! 
      x264enc tune=zerolatency speed-preset=ultrafast key-int-max=30 bitrate=2000 ! 
      rtph264pay config-interval=1 ! 
      tee name=t
      t. ! queue ! udpsink host=flipper port=5000 sync=false
      t. ! queue ! udpsink host=receiver port=5001 sync=false
    networks:
      - video_net

  flipper:
    image: gst-myfilter-opencv:latest
    container_name: video_flipper
    depends_on:
      - sender
    volumes:
      - ./yolo11n.onnx:/app/yolo11n.onnx 
      - ./labels.json:/app/labels.json 
    command: >
      gst-launch-1.0 
      udpsrc port=5000 buffer-size=2097152 caps="application/x-rtp,media=video,clock-rate=90000,encoding-name=H264,payload=96" ! 
      queue max-size-buffers=1 ! 
      rtph264depay ! 
      avdec_h264 ! 
      videoconvert ! 
      video/x-raw,format=BGR !
      queue max-size-buffers=1 leaky=2 !
      yolodetection model-path="/app/yolo11n.onnx" conf-threshold=0.3 ! 
      videoconvert ! 
      queue ! 
      x264enc tune=zerolatency speed-preset=ultrafast key-int-max=30 bitrate=2000 ! 
      rtph264pay config-interval=1 ! 
      udpsink host=receiver port=5000 sync=false
    networks:
      - video_net

  mediamtx:
    image: bluenviron/mediamtx
    container_name: media_server
    ports:
      - "8889:8889" # WebRTC
      - "8888:8888" # HLS/MPEG-DASH
      - "8554:8554" # RTSP
    networks:
      - video_net

  receiver:
    build: .
    container_name: video_receiver
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix 
    depends_on:
      - flipper
    command: >
      compositor name=comp background=black
      sink_0::xpos=0 sink_0::ypos=0 sink_0::width=640 sink_0::height=480 
      sink_1::xpos=640 sink_1::ypos=0 sink_1::width=640 sink_1::height=480 ! 
      videoconvert ! 
      video/x-raw,format=I420,width=1280,height=480,framerate=30/1 ! 
      x264enc tune=zerolatency bitrate=2000 ! h264parse ! 
      rtspclientsink location=rtsp://mediamtx:8554/mystream 
      udpsrc port=5001 caps="application/x-rtp,media=video,clock-rate=90000,encoding-name=H264,payload=96" ! 
      rtph264depay ! avdec_h264 ! videoconvert ! videoscale ! video/x-raw,width=640,height=480 ! queue ! comp.sink_0 
      udpsrc port=5000 caps="application/x-rtp,media=video,clock-rate=90000,encoding-name=H264,payload=96" ! 
      rtph264depay ! avdec_h264 ! videoconvert ! videoscale ! video/x-raw,width=640,height=480 ! queue ! comp.sink_1
    networks:
      - video_net

networks:
  video_net:
    driver: bridge