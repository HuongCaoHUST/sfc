version: '3.8'

services:
  sender:
    build: .
    container_name: video_sender
    devices:
      - "/dev/video0:/dev/video0"
    command: >
      v4l2src device=/dev/video0 ! 
      videoconvert ! 
      x264enc tune=zerolatency bitrate=2000 ! 
      rtph264pay ! 
      udpsink host=receiver port=5000
    networks:
      - video_net

  receiver:
    build: .
    container_name: video_receiver
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix 
    depends_on:
      - sender
    command: >
      udpsrc port=5000 ! 
      application/x-rtp,payload=96 ! 
      rtph264depay ! 
      avdec_h264 ! 
      videoconvert ! 
      videoflip method=rotate-180 ! 
      autovideosink
    networks:
      - video_net

networks:
  video_net:
    driver: bridge